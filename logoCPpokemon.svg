<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120">
  <defs>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B73B9" />
      <stop offset="100%" stop-color="#1B4B7A" />
    </linearGradient>
  </defs>

  <!-- ICONO: Tarjeta estilizada con "CP" -->
  <g transform="translate(15, 10)">
    <!-- Tarjeta inclinada de fondo -->
    <rect x="15" y="5" width="60" height="85" rx="6" fill="#FFDE00" transform="rotate(-10 45 47)"/>
    <!-- Tarjeta principal -->
    <rect x="10" y="10" width="60" height="85" rx="6" fill="url(#blueCard)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- CP dentro de la tarjeta -->
    <text x="40" y="62" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#FFDE00" text-anchor="middle" stroke="#000" stroke-width="1">CP</text>
  </g>

  <!-- TEXTO -->
  <text x="110" y="65" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="#FFC700" stroke="#3B4CCA" stroke-width="2" letter-spacing="1">
    CP
  </text>
  
  <text x="180" y="58" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#2A2A2A">
    CARD <tspan fill="#FF1122">&amp;</tspan> POKÉMON
  </text>
  
  <text x="181" y="78" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#666666" letter-spacing="4">
    STORE &amp; TCG COLLECTION
  </text>
</svg>
