<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="45%" stop-color="#0d0d0d"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#333333"/>
      <stop offset="80%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Light distress: subtle, barely-there displacement, not heavy grunge -->
    <filter id="lightDistress" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.09" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="none"/>

  <!-- ============ WORDMARK — heavy weight, subtle texture only ============ -->
  <g filter="url(#dropShadow)">
    <g filter="url(#lightDistress)">
      <text x="10" y="195"
            font-family="'Rockwell', 'Roboto Slab', 'Arial Black', 'Georgia', serif"
            font-size="180"
            font-weight="900"
            letter-spacing="-3"
            fill="url(#deepBlack)"
            stroke="#000000"
            stroke-width="5"
            paint-order="stroke">MAELO</text>

      <text x="10" y="195"
            font-family="'Rockwell', 'Roboto Slab', 'Arial Black', 'Georgia', serif"
            font-size="180"
            font-weight="900"
            letter-spacing="-3"
            fill="url(#sheen)">MAELO</text>
    </g>
  </g>

  <!-- Clean underline bar (distress removed, crisper line) -->
  <rect x="12" y="202" width="945" height="9" rx="1.5" fill="#000000"/>

  <!-- Subtitle -->
  <text x="14" y="255"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="36"
        font-weight="700"
        letter-spacing="10"
        fill="#050505">BARBER STUDIO</text>

  <rect x="17" y="270" width="560" height="4" rx="2" fill="url(#metalEdge)"/>
</svg>
